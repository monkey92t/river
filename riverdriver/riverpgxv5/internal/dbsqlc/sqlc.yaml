version: "2"
sql:
  - engine: "postgresql"
    queries:
      - pg_misc.sql
      - river_job.sql
      - river_job_copyfrom.sql
      - river_leader.sql
      - river_migration.sql
      - river_notification.sql
      - river_queue.sql
      - schema.sql
    schema:
      - pg_misc.sql
      - river_job.sql
      - river_leader.sql
      - river_migration.sql
      - river_notification.sql
      - river_queue.sql
      - schema.sql
    gen:
      go:
        package: "dbsqlc"
        sql_package: "pgx/v5"
        out: "."
        emit_exact_table_names: true
        emit_methods_with_db_argument: true
        emit_params_struct_pointers: true
        emit_result_struct_pointers: true

        rename:
          ids: "IDs"
          ttl: "TTL"

        overrides:
          - db_type: "pg_catalog.interval"
            go_type: "time.Duration"

          - db_type: "timestamptz"
            go_type: "time.Time"

          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true

          - column: "river_job.sequence_key"
            go_type:
              type: "string"
              pointer: true
          - column: "river_job.sequence_position"
            go_type:
              type: "int64"
              pointer: true
          - column: "river_job.sequence_continue_on_cancelled"
            go_type:
              type: "bool"
              pointer: true
          - column: "river_job.sequence_continue_on_discarded"
            go_type:
              type: "bool"
              pointer: true
          - column: "river_sequence_group.blocked_job_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "river_sequence_group.blocked_position"
            go_type:
              type: "int64"
              pointer: true
          - column: "river_sequence_group.blocked_reason"
            go_type:
              type: "string"
              pointer: true
